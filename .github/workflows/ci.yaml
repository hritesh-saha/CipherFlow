name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Compile the Application Code
      - name: Install and Build API
        working-directory: ./cipherflow-api
        run: |
          npm ci
          npm run build

      - name: Install and Build Worker
        working-directory: ./cipherflow-worker
        run: |
          npm ci
          npm run build

      # 2. Build Docker Images Locally for Scanning
      - name: Build API Docker Image
        run: docker build -t cipherflow-api:ci-test ./cipherflow-api

      - name: Build Worker Docker Image
        run: docker build -t cipherflow-worker:ci-test ./cipherflow-worker

      # 3. DevSecOps: Trivy Vulnerability Scan
      - name: Run Trivy Scan on API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cipherflow-api:ci-test'
          format: 'table'
          # exit-code: '1' tells GitHub to fail the pipeline if vulnerabilities are found
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'