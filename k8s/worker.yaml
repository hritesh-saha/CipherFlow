apiVersion: apps/v1
kind: Deployment
metadata:
  name: cipherflow-worker
  labels:
    app: cipherflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cipherflow-worker
  template:
    metadata:
      labels:
        app: cipherflow-worker
    spec:
      # DEVSECOPS FIX: Attach the restricted ServiceAccount
      serviceAccountName: cipherflow-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: worker
        image: cipherflow-worker:1.1
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"     # Workers do cryptography, so we give them a slightly higher CPU cap
            memory: "256Mi"
        env:
        - name: REDIS_HOST
          value: "redis-svc"
        - name: DB_HOST
          value: "postgres-svc"
        - name: DB_NAME
          value: "cipherflow"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: cipherflow-secrets
              key: encryption-key
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: cipherflow-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cipherflow-secrets
              key: db-password

---
apiVersion: v1
kind: Service
metadata:
  name: cipherflow-worker-svc
spec:
  selector:
    app: cipherflow-worker
  ports:
    - name: http       # <--- REQUIRED FOR PROMETHEUS
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP