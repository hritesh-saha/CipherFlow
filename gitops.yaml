apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cipherflow-architecture
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hritesh-saha/CipherFlow'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true